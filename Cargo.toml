[workspace]
resolver = "2"
members = []

[workspace.package]
name = "scope"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "System for Contextual Orchestration of Projects & Execution"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/scope"
keywords = ["orchestration", "project", "execution", "system"]
categories = ["development-tools"]

[workspace.dependencies]
# Common dependencies for workspace members can be added here
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.0", features = ["derive"] }